[project]
name = "interview-backend"
version = "0.1.0"
description = "FastAPI backend for InterviewGuide"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "sqlalchemy[asyncio]>=2.0.41",
  "asyncpg>=0.30",
  "alembic>=1.16",
  "PyJWT>=2.10",
  "pwdlib[argon2,bcrypt]>=0.2",
  "httpx>=0.28",
  "requests>=2.32",
  "redis>=6.2",
  "boto3>=1.39",
  "cryptography>=45",
  "pypdf>=5.8",
  "python-docx>=1.2",
  "python-multipart>=0.0.20",
  "reportlab>=4.4",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "aiosqlite>=0.21",
  "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"] # FastAPI dependency markers intentionally live in parameter defaults.

[tool.ruff.lint.per-file-ignores]
"app/scoring.py" = ["E501"] # Exact source rubric strings are intentionally kept inline.
